# Serves the built UI and forwards /api/... to the API without the /api prefix, like the Vite dev proxy.
upstream api {
  server backend:3000;
  # Reused connections to the API. The API keeps idle connections for 65 s, longer than nginx's 60 s, so nginx never
  # sends a request on a connection the API is closing (F-14).
  keepalive 16;
  keepalive_timeout 60s;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Hashed build files never change, so they can be cached for long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Every other path is a route of the single page app, such as /schedules/12.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
